<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igreja Renovada Aliança com Cristo</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#020817;
  color:white;
}

nav {
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  padding:15px;
  text-align:center;
}

nav a {
  color:gold;
  margin:0 10px;
  text-decoration:none;
  font-weight:bold;
}

.hero {
  margin-top:80px;
  text-align:center;
  padding:50px;
}

h1 {
  font-size:50px;
}

.section {
  padding:50px;
  text-align:center;
}

.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.gallery img, .gallery video {
  width:100%;
  border-radius:10px;
}

</style>
</head>

<body>

<nav>
  <a href="#inicio">Início</a>
  <a href="#galeria">Galeria</a>
  <a href="#oracao">Oração</a>
</nav>

<div class="hero" id="inicio">
  <h1>Igreja Renovada</h1>
  <h2>Aliança com Cristo</h2>
</div>

<div class="section" id="galeria">
  <h2>Galeria</h2>
  <div id="galeriaAutomatica" class="gallery"></div>
</div>

<div class="section" id="oracao">
  <h2>Pedido de Oração</h2>
  <form name="oracao" method="POST" data-netlify="true">
    <input type="text" name="nome" placeholder="Seu nome" required><br><br>
    <textarea name="pedido" placeholder="Seu pedido"></textarea><br><br>
    <button type="submit">Enviar</button>
  </form>
</div>

<script>
const usuario = "Igreja-Alianca-c-Cristo";
const repositorio = "igreja-alianca-c-cristo.github.io";
const pasta = "uploads/aniversario";

const url = `https://api.github.com/repos/${usuario}/${repositorio}/contents/${pasta}`;

fetch(url)
.then(res => res.json())
.then(arquivos => {

  const galeria = document.getElementById("galeriaAutomatica");

  arquivos.forEach(arq => {

    if(arq.name.match(/\.(jpg|png|jpeg|mp4)$/i)){

      let elemento;

      if(arq.name.endsWith(".mp4")){
        elemento = document.createElement("video");
        elemento.src = arq.download_url;
        elemento.controls = true;
      } else {
        elemento = document.createElement("img");
        elemento.src = arq.download_url;
      }

      galeria.appendChild(elemento);
    }

  });

});
</script>

</body>
</html>
