<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria - Aniversário de 6 anos</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1a2a;color:white}
.container{padding:20px;max-width:1200px;margin:auto}
h2{text-align:center;margin-top:20px;font-size:30px}
.tabs{display:flex;gap:10px;justify-content:center;margin:20px 0 28px}
.tabs button{padding:12px 24px;border:none;border-radius:12px;background:#12263a;color:white;cursor:pointer;transition:.3s;font-weight:bold}
.tabs button.active,.tabs button:hover{background:#f7c948;color:#000;transform:translateY(-2px)}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.galeria img{width:100%;height:280px;object-fit:cover;border-radius:14px;display:block}
.video-card{position:relative;border-radius:14px;overflow:hidden;background:#07111f;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.video-card video{width:100%;height:280px;object-fit:cover;display:block;border-radius:14px}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(247,201,72,.92);color:#000;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:.25s}
.play-btn:hover{transform:translate(-50%,-50%) scale(1.08);background:#ffd84d}
.video-card.playing .play-btn{opacity:0;pointer-events:none}
.video-title{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:bold}
@media(max-width:700px){h2{font-size:24px}.galeria{grid-template-columns:1fr}.galeria img,.video-card video{height:auto}}
</style>
</head>

<body>
<div class="container">
<h2>Aniversário de 6 anos</h2>

<div class="tabs">
  <button class="active" onclick="mostrar('fotos', event)">Fotos</button>
  <button onclick="mostrar('videos', event)">Vídeos</button>
</div>

<div id="fotos" class="galeria">
  <img src="uploads/aniversario/fotos/foto1.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto2.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto3.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto4.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto5.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto6.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto7.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto8.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto9.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto10.jpg" alt="">
  <img src="uploads/aniversario/fotos/foto11.jpg" alt="">
</div>

<div id="videos" class="galeria" style="display:none;">

  <div class="video-card">
    <video preload="metadata" playsinline>
      <source src="uploads/aniversario/videos/aniversario-6-anos-01.mp4" type="video/mp4">
    </video>
    <button class="play-btn" onclick="tocarVideo(this)">▶</button>
    <div class="video-title">Vídeo 01</div>
  </div>

  <div class="video-card">
    <video preload="metadata" playsinline>
      <source src="uploads/aniversario/videos/aniversario-6-anos-02.mp4" type="video/mp4">
    </video>
    <button class="play-btn" onclick="tocarVideo(this)">▶</button>
    <div class="video-title">Vídeo 02</div>
  </div>

  <div class="video-card">
    <video preload="metadata" playsinline>
      <source src="uploads/aniversario/videos/aniversario-6-anos-03.mp4" type="video/mp4">
    </video>
    <button class="play-btn" onclick="tocarVideo(this)">▶</button>
    <div class="video-title">Vídeo 03</div>
  </div>

  <div class="video-card">
    <video preload="metadata" playsinline>
      <source src="uploads/aniversario/videos/aniversario-6-anos-04.mp4" type="video/mp4">
    </video>
    <button class="play-btn" onclick="tocarVideo(this)">▶</button>
    <div class="video-title">Vídeo 04</div>
  </div>

  <div class="video-card">
    <video preload="metadata" playsinline>
      <source src="uploads/aniversario/videos/aniversario-6-anos-05.mp4" type="video/mp4">
    </video>
    <button class="play-btn" onclick="tocarVideo(this)">▶</button>
    <div class="video-title">Vídeo 05</div>
  </div>

  <div class="video-card">
    <video preload="metadata" playsinline>
      <source src="uploads/aniversario/videos/aniversario-6-anos-06.mp4" type="video/mp4">
    </video>
    <button class="play-btn" onclick="tocarVideo(this)">▶</button>
    <div class="video-title">Vídeo 06</div>
  </div>

  <div class="video-card">
    <video preload="metadata" playsinline>
      <source src="uploads/aniversario/videos/aniversario-6-anos-07.mp4" type="video/mp4">
    </video>
    <button class="play-btn" onclick="tocarVideo(this)">▶</button>
    <div class="video-title">Vídeo 07</div>
  </div>

  <div class="video-card">
    <video preload="metadata" playsinline>
      <source src="uploads/aniversario/videos/aniversario-6-anos-08.mp4" type="video/mp4">
    </video>
    <button class="play-btn" onclick="tocarVideo(this)">▶</button>
    <div class="video-title">Vídeo 08</div>
  </div>

</div>
</div>

<script>
function mostrar(tipo, e){
  document.getElementById('fotos').style.display = tipo === 'fotos' ? 'grid' : 'none';
  document.getElementById('videos').style.display = tipo === 'videos' ? 'grid' : 'none';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  document.querySelectorAll('video').forEach(v => {
    v.pause();
    const card = v.closest('.video-card');
    if(card) card.classList.remove('playing');
  });
}

function tocarVideo(botao){
  const card = botao.closest('.video-card');
  const video = card.querySelector('video');
  document.querySelectorAll('video').forEach(v => {
    if(v !== video){
      v.pause();
      const otherCard = v.closest('.video-card');
      if(otherCard) otherCard.classList.remove('playing');
    }
  });
  video.setAttribute('controls', 'controls');
  video.play();
  card.classList.add('playing');
}

document.querySelectorAll('video').forEach(video => {
  video.addEventListener('pause', () => {
    const card = video.closest('.video-card');
    if(card) card.classList.remove('playing');
  });
  video.addEventListener('ended', () => {
    const card = video.closest('.video-card');
    if(card) card.classList.remove('playing');
  });
});
</script>
</body>
</html>
