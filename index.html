<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria - Aniversário 6 anos</title>

<style>
body{margin:0;font-family:Arial;background:#0b1a2a;color:white}

.container{padding:20px}

.tabs{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
}

.tabs button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#12263a;
  color:white;
  cursor:pointer;
  transition:.3s;
}

.tabs button.active,
.tabs button:hover{
  background:#f7c948;
  color:#000;
}

.galeria{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:10px;
}

.galeria img,
.galeria video{
  width:100%;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2 style="text-align:center;">Aniversário de 6 anos</h2>

<div class="tabs">
  <button class="active" onclick="mostrar('fotos')">Fotos</button>
  <button onclick="mostrar('videos')">Vídeos</button>
</div>

<div id="fotos" class="galeria">
  <img src="uploads/aniversario/fotos/foto1.jpg">
  <img src="uploads/aniversario/fotos/foto2.jpg">
  <img src="uploads/aniversario/fotos/foto3.jpg">
</div>

<div id="videos" class="galeria" style="display:none;">
  <video controls>
    <source src="uploads/aniversario/videos/aniversario-6-anos-01.mp4">
  </video>
  <video controls>
    <source src="uploads/aniversario/videos/aniversario-6-anos-02.mp4">
  </video>
</div>

</div>

<script>
function mostrar(tipo){
  document.getElementById('fotos').style.display = tipo==='fotos' ? 'grid' : 'none';
  document.getElementById('videos').style.display = tipo==='videos' ? 'grid' : 'none';

  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}
</script>

</body>
</html>
