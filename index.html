<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igreja</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d0d0d;
  color: white;
}

header {
  background: #000;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 10px;
  padding: 15px;
}

.foto {
  overflow: hidden;
  border-radius: 10px;
}

.foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.foto img:hover {
  transform: scale(1.05);
}

.lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
}
</style>
</head>

<body>

<header>
Igreja - Galeria
</header>

<div class="galeria">
  <div class="foto"><img src="foto1.jpg" onclick="abrir(this)"></div>
  <div class="foto"><img src="foto2.jpg" onclick="abrir(this)"></div>
  <div class="foto"><img src="foto3.jpg" onclick="abrir(this)"></div>
  <div class="foto"><img src="foto4.jpg" onclick="abrir(this)"></div>
  <div class="foto"><img src="foto5.jpg" onclick="abrir(this)"></div>
  <div class="foto"><img src="foto6.jpg" onclick="abrir(this)"></div>
  <div class="foto"><img src="foto7.jpg" onclick="abrir(this)"></div>
  <div class="foto"><img src="foto8.jpg" onclick="abrir(this)"></div>
</div>

<div class="lightbox" id="lightbox" onclick="fechar()">
  <img id="imgGrande">
</div>

<script>
function abrir(img){
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("imgGrande").src = img.src;
}

function fechar(){
  document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
