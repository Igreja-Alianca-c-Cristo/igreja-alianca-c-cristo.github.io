<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igreja Renovada Aliança com Cristo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background: radial-gradient(circle at top, #0a1a2f, #020812);color:white;}

header{
position:fixed;top:0;width:100%;
display:flex;justify-content:space-between;align-items:center;
padding:15px 40px;background:#020812;
border-bottom:1px solid rgba(255,255,255,0.1);z-index:999;
}

.logo-top{display:flex;align-items:center;gap:10px;}
.logo-top img{width:40px;}
.logo-top span{
color:#f7c948;font-weight:bold;
animation: brilho 3s infinite;
}

nav a{color:white;margin-left:20px;text-decoration:none;}

@keyframes brilho{
0%{opacity:0.6;}50%{opacity:1;}100%{opacity:0.6;}
}

.hero{text-align:center;padding-top:140px;}

.logo-central{
width:140px;
animation: flutuar 4s ease-in-out infinite;
}

@keyframes flutuar{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

.tarja{
background:#f7c948;color:#000;
padding:12px 25px;border-radius:30px;
display:inline-block;margin:20px 0;
animation:pulsar 3s infinite;
}

@keyframes pulsar{
0%{opacity:0.7;}50%{opacity:1;}100%{opacity:0.7;}
}

.igreja-clean{
background:none !important;border:none !important;
box-shadow:none !important;backdrop-filter:none !important;
color:#f7c948;font-size:22px;font-weight:800;
letter-spacing:4px;margin-bottom:10px;text-transform:uppercase;
}

.hero h1{font-size:55px;margin:10px 0;}
.frase{margin-top:10px;opacity:0.8;}

.galeria{margin-top:80px;text-align:center;}
.galeria h2{
color:#f7c948;font-size:35px;margin-bottom:10px;
position:relative;display:inline-block;
}

.galeria h2::after{
content:'';width:100%;height:2px;background:#f7c948;
position:absolute;left:0;bottom:-5px;
animation:linha 3s infinite;
}

@keyframes linha{
0%{transform:scaleX(0);}
50%{transform:scaleX(1);}
100%{transform:scaleX(0);}
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;padding:20px;
}

.grid img{
width:100%;border-radius:15px;cursor:pointer;
}

.modal{
display:none;position:fixed;top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;align-items:center;
}

.modal img{max-width:90%;max-height:90%;}
</style>
</head>

<body>

<header>
<div class="logo-top">
<img src="logo.png">
<span>Igreja Renovada Aliança com Cristo</span>
</div>

<nav>
<a href="#">Início</a>
<a href="#">Cultos</a>
<a href="#">Galeria</a>
<a href="#">Oração</a>
</nav>
</header>

<section class="hero">

<img src="logo.png" class="logo-central">

<div class="tarja">Casa de oração • Palavra • Família</div>

<div class="igreja-clean">IGREJA RENOVADA</div>

<h1>ALIANÇA COM CRISTO</h1>

<div class="frase">
“Assim que, se alguém está em Cristo, nova criatura é...”
</div>

</section>

<section class="galeria">

<h2>Galeria da Igreja</h2>

<div class="grid">
<img src="img1.jpg">
<img src="img2.jpg">
<img src="img3.jpg">
</div>

</section>

<div class="modal" id="modal">
<img id="modalImg">
</div>

<script>
const imagens=document.querySelectorAll(".grid img");
const modal=document.getElementById("modal");
const modalImg=document.getElementById("modalImg");

imagens.forEach(img=>{
img.onclick=()=>{
modal.style.display="flex";
modalImg.src=img.src;
};
});

modal.onclick=()=>{
modal.style.display="none";
};
</script>

</body>
</html>
