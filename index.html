<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igreja - Louvor</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1a2a;
    color: white;
}

.menu {
    background: #06121f;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

.menu a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    cursor: pointer;
}

#louvorModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#louvorModal iframe {
    width: 90%;
    height: 70%;
    border-radius: 12px;
}

#fechar {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 30px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="menu">
    <div>Igreja Renovada</div>
    <div>
        <a onclick="abrirLouvor()">Louvor 🎵</a>
    </div>
</div>

<div id="louvorModal">
    <div id="fechar" onclick="fecharLouvor()">✖</div>
    <iframe id="videoLouvor" src="" allow="autoplay"></iframe>
</div>

<script>
function abrirLouvor() {
    document.getElementById("louvorModal").style.display = "flex";
    document.getElementById("videoLouvor").src =
        "https://www.youtube.com/embed/4W5TTuJg3Xc?autoplay=1&mute=1";
}

function fecharLouvor() {
    document.getElementById("louvorModal").style.display = "none";
    document.getElementById("videoLouvor").src = "";
}
</script>

</body>
</html>
