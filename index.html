<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igreja Renovada Aliança com Cristo</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(120deg,#000814,#001d3d,#003566);
  color:#fff;
}

header{
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:#000814;
  position:sticky;
  top:0;
}

header a{
  color:#fff;
  margin-left:20px;
  text-decoration:none;
}

.hero{
  text-align:center;
  padding:80px 20px;
}

.hero h1{
  font-size:50px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:30px;
  flex-wrap:wrap;
}

.card{
  background:#001d3d;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.oracao{
  display:flex;
  gap:30px;
  padding:60px;
  flex-wrap:wrap;
}

.oracao form{
  display:flex;
  flex-direction:column;
  gap:10px;
  flex:1;
}

.oracao input, .oracao textarea{
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  background:#ffd60a;
  border:none;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <strong>Igreja Renovada Aliança com Cristo</strong>
  <div>
    <a href="#inicio">Início</a>
    <a href="#oracao">Oração</a>
  </div>
</header>

<section class="hero" id="inicio">
  <h1>Aliança com Cristo</h1>
  <p>“Assim que, se alguém está em Cristo, nova criatura é.”</p>

  <div class="stats">
    <div class="card">
      <h2>6</h2>
      <p>Anos de templo</p>
    </div>

    <div class="card">
      <h2>3</h2>
      <p>Cultos semanais</p>
    </div>

    <div class="card">
      <h2>Recife/PE</h2>
      <p>Jiquiá</p>
    </div>
  </div>
</section>

<section id="oracao" class="oracao">
  <div>
    <h3>INTERCESSÃO</h3>
    <h1>Pedidos de Oração</h1>
    <p>Preencha o formulário e envie seu pedido de oração.</p>
  </div>

  <form id="formOracao">
    <input type="text" id="nome" placeholder="Seu nome" required>
    <input type="text" id="telefone" placeholder="Telefone (opcional)">
    <textarea id="pedido" placeholder="Digite seu pedido" required></textarea>

    <button type="submit">Enviar pedido de oração</button>
  </form>
</section>

<script>
document.getElementById("formOracao").addEventListener("submit", function(e){
  e.preventDefault();

  const nome = document.getElementById("nome").value;
  const telefone = document.getElementById("telefone").value;
  const pedido = document.getElementById("pedido").value;

  const mensagem =
`Pedido de Oração

Nome: ${nome}
Telefone: ${telefone}

Pedido:
${pedido}`;

  const numero = "5581998346828";

  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`, "_blank");
});
</script>

</body>
</html>
