<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesouraria Segura</title>
<style>
:root{--gold:#f7c948}
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at top left, rgba(247,201,72,.16), transparent 35%),
linear-gradient(135deg,#020812,#071c3d 55%,#020812);
color:#fff;
}
.login-screen{
position:fixed;inset:0;
display:flex;align-items:center;justify-content:center;
padding:20px;background:rgba(0,0,0,.45);
backdrop-filter:blur(8px);
}
.login-box{
width:min(420px,100%);
background:rgba(10,24,48,.92);
border:1px solid rgba(247,201,72,.24);
border-radius:28px;
padding:30px;
box-shadow:0 28px 80px rgba(0,0,0,.38);
text-align:center;
}
.login-box h1{color:var(--gold)}
.login-box p{color:#dbe5f7}
input{
width:100%;
margin-top:18px;
padding:14px;
border:none;
border-radius:16px;
font-size:16px;
}
button{
margin-top:16px;
width:100%;
border:none;
border-radius:999px;
padding:14px;
background:linear-gradient(135deg,var(--gold),#ffe58a);
color:#07142d;
font-weight:900;
cursor:pointer;
}
.error{color:#ff9db1;margin-top:12px;display:none}

.topbar{
display:none;
position:fixed;
top:16px;
right:16px;
z-index:99999;
}

.logout-btn{
padding:12px 18px;
border:none;
border-radius:999px;
background:#ff5c7a;
color:white;
font-weight:900;
cursor:pointer;
box-shadow:0 12px 35px rgba(0,0,0,.35);
}

iframe{
width:100%;
height:100vh;
border:none;
display:none;
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
<div class="login-box">
<h1>🔒 Área Administrativa</h1>
<p>Painel interno da tesouraria da igreja.</p>

<input type="password" id="senha" placeholder="Digite a senha">
<button onclick="entrar()">Entrar</button>

<div class="error" id="erro">Senha incorreta.</div>
</div>
</div>

<div class="topbar" id="topbar">
<button class="logout-btn" onclick="sair()">Sair</button>
</div>

<iframe id="painel" src="painel-alianca-2026.html"></iframe>

<script>
const SENHA = "Alianca2026";

if(sessionStorage.getItem("tesouraria_logada") === "sim"){
liberar();
}

function entrar(){
const senha = document.getElementById("senha").value;

if(senha === SENHA){
sessionStorage.setItem("tesouraria_logada","sim");
liberar();
}else{
document.getElementById("erro").style.display = "block";
}
}

function liberar(){
document.getElementById("loginScreen").style.display = "none";
document.getElementById("painel").style.display = "block";
document.getElementById("topbar").style.display = "block";
}

function sair(){
sessionStorage.removeItem("tesouraria_logada");
location.reload();
}

document.getElementById("senha").addEventListener("keydown", function(e){
if(e.key === "Enter"){
entrar();
}
});
</script>

</body>
</html>
