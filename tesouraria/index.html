<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesouraria Segura</title>
<link rel="icon" type="image/png" href="logo-igreja.png">
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#020812,#071c3d 55%,#020812);
color:white;
padding:20px;
}
.login{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.6);
}
.box{
background:#08152b;
padding:30px;
border-radius:25px;
width:min(420px,95%);
}
input,select{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
}
button{
padding:14px 22px;
border:none;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}
.entrar{
width:100%;
margin-top:15px;
background:#f7c948;
}
#painel{display:none;}
.topo{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
}
.sair{
background:#ff4d6d;
color:white;
}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}
.card{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
}
.valor{
font-size:32px;
font-weight:bold;
color:#f7c948;
}
.form{
margin-top:20px;
background:rgba(255,255,255,.05);
padding:20px;
border-radius:20px;
}
table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}
th,td{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.1);
}
th{color:#f7c948;}
.add{
background:#f7c948;
margin-top:15px;
}
</style>
</head>
<body>

<div class="login" id="login">
<div class="box">
<h1 style="color:#f7c948">🔒 Tesouraria Segura</h1>
<p>Painel administrativo da igreja</p>
<input type="password" id="senha" placeholder="Digite a senha">
<button class="entrar" onclick="entrar()">Entrar</button>
</div>
</div>

<div id="painel">

<div class="topo">
<div>
<h1 style="color:#f7c948">Painel da Tesouraria</h1>
<p>Igreja Renovada Aliança com Cristo</p>
</div>

<button class="sair" onclick="sair()">Sair</button>
</div>

<div class="cards">
<div class="card">
<h3>Saldo</h3>
<div class="valor" id="saldo">R$ 0,00</div>
</div>

<div class="card">
<h3>Entradas</h3>
<div class="valor" id="entradas">R$ 0,00</div>
</div>

<div class="card">
<h3>Saídas</h3>
<div class="valor" id="saidas">R$ 0,00</div>
</div>
</div>

<div class="form">
<h2 style="color:#f7c948">Nova movimentação</h2>

<input type="text" id="descricao" placeholder="Descrição">
<input type="number" id="valor" placeholder="Valor">

<select id="tipo">
<option value="entrada">Entrada</option>
<option value="saida">Saída</option>
</select>

<input type="date" id="data">

<button class="add" onclick="adicionar()">Salvar</button>

<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Tipo</th>
<th>Valor</th>
</tr>
</thead>

<tbody id="lista"></tbody>

</table>

</div>

</div>

<script>

const SENHA="Alianca2026";
let dados = JSON.parse(localStorage.getItem("tesourariaDados")) || [];

function entrar(){
const senha=document.getElementById("senha").value;

if(senha===SENHA){
sessionStorage.setItem("logado","sim");
document.getElementById("login").style.display="none";
document.getElementById("painel").style.display="block";
renderizar();
}else{
alert("Senha incorreta");
}
}

function sair(){
sessionStorage.removeItem("logado");
location.reload();
}

if(sessionStorage.getItem("logado")==="sim"){
document.getElementById("login").style.display="none";
document.getElementById("painel").style.display="block";
renderizar();
}

function adicionar(){

const descricao=document.getElementById("descricao").value;
const valor=parseFloat(document.getElementById("valor").value);
const tipo=document.getElementById("tipo").value;
const data=document.getElementById("data").value;

if(!descricao || !valor || !data){
alert("Preencha tudo");
return;
}

dados.unshift({descricao,valor,tipo,data});

localStorage.setItem("tesourariaDados",JSON.stringify(dados));

renderizar();

document.getElementById("descricao").value="";
document.getElementById("valor").value="";
document.getElementById("data").value="";
}

function renderizar(){

let entradas=0;
let saidas=0;

const lista=document.getElementById("lista");
lista.innerHTML="";

dados.forEach(item=>{

if(item.tipo==="entrada"){
entradas+=item.valor;
}else{
saidas+=item.valor;
}

lista.innerHTML += `
<tr>
<td>${item.data}</td>
<td>${item.descricao}</td>
<td>${item.tipo}</td>
<td>R$ ${item.valor.toFixed(2)}</td>
</tr>
`;

});

document.getElementById("entradas").innerHTML="R$ "+entradas.toFixed(2);
document.getElementById("saidas").innerHTML="R$ "+saidas.toFixed(2);
document.getElementById("saldo").innerHTML="R$ "+(entradas-saidas).toFixed(2);

}

</script>

</body>
</html>
